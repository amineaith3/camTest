<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Camera Capture for OCR</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h2>📸 Capture Full HD Photo for OCR</h2>
  <video id="video" autoplay playsinline></video><br>
  <button id="snap">📸 Capture Photo</button>
  <a id="download" href="#" download="ocr_photo.png" style="display: none;">💾 Download</a><br>
  <canvas id="canvas" style="display:none;"></canvas>
  <img id="photo" alt="Captured" style="display: none;"/>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const snapBtn = document.getElementById("snap");
    const downloadLink = document.getElementById("download");
    const photo = document.getElementById("photo");

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            facingMode: "environment"
          }
        });
        video.srcObject = stream;
      } catch (err1) {
        console.warn("Full HD failed, trying 720p fallback:", err1);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              width: { ideal: 1280 },
              height: { ideal: 720 },
              facingMode: "environment"
            }
          });
          video.srcObject = stream;
        } catch (err2) {
          console.error("720p fallback failed, using default resolution:", err2);
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: true
            });
            video.srcObject = stream;
          } catch (err3) {
            alert("Camera error: " + err3.message);
          }
        }
      }
    }
    

    snapBtn.addEventListener("click", () => {
      const width = video.videoWidth;
      const height = video.videoHeight;
      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(video, 0, 0, width, height);
      const dataURL = canvas.toDataURL("image/png");
      photo.src = dataURL;
      photo.style.display = "block";
      downloadLink.href = dataURL;
      downloadLink.style.display = "inline-block";
    });

    startCamera();
  </script>
</body>
</html>
